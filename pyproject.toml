[project]
name = "event-space-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RamanYakshevich", email = "s227736@sggw.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
event-space-api = "event_space_api:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
